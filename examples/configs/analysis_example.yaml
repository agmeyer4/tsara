# ============================================================================
# TSARA analysis config example
# ----------------------------------------------------------------------------
# Describes the SCIENCE applied to ingested data. List-valued fields
# (baseline windows/quantiles, events enter/exit multiples, smoothing cutoffs)
# are PARAMETER SWEEP dimensions: every combination is evaluated, and the
# spread of results across the hypercube becomes the methodological
# uncertainty. Single-element lists = fixed methodology, zero sweep.
# Load with:
#     from tsara import load_analysis
#     a = load_analysis("analysis_example.yaml")
# ============================================================================

# --- Output grid (optional) ----------------------------------------------
# A uniform tiling of cells: one kind of cell set, built when an export wants
# a rectangular table (METHODS.md §1.4). NOT what streams are synchronized
# onto ("synchronize late", §1.1), and NOT where the continuous baseline state
# lives -- that is per stream at native rate, beside the readings (§6.2).
# Leave the whole block out when nothing is exported on a tiling.
output_grid:
  freq: 1s                # the tiling's period, chosen for the export
  start: 2024-07-18T18:00:00   # optional; default = first timestamp across streams
  end: 2024-07-19T00:00:00     # optional; default = last timestamp across streams
# There is deliberately no choice of binning statistic. A median option was
# specified in Phase 1 and removed before it was ever implemented: its job is
# robustness to sub-grid spikes, and here a sub-grid spike IS the plume.
# Measured on real mobile CH4 over ten drive days, a 60 s median discards
# 19.6% of the enhancement mass (METHODS.md §11.7.1).

# --- Support policy ------------------------------------------------------
# Every join averages readings onto target cells and records what that did
# to their support (METHODS.md §11.2.4): averaged, shared, narrowed -- or
# copied, when a reading is at least twice as wide as a cell it fills. Two
# things are decided here; gases are never interpolated (§1.2).
alignment:
  finer_support: refuse   # copy a reading across rows? refuse (default) or allow, labelled 'copied' and warned
  max_interp_gap: 10s     # never interpolate GPS/met across gaps longer than this (§11.6)

# --- Cross-species pairing -----------------------------------------------
# Pairing has no free parameters of its own -- the clock is always the cells
# of whichever stream has the WIDER support (METHODS.md §1.3), unless a call
# passes target= to put both species on cells of its own choosing. It does have a
# sufficiency question: a 15 s canister paired against a 60 s mean covers a
# quarter of that cell, and the arithmetic cannot tell that from full
# coverage. Coverage is always recorded; this decides whether to act on it.
pairing:
  min_coverage: 0.0       # 0.0 drops nothing; raise to exclude thin pairs

# --- Baselines (the baseline stage, tsara.baseline) --------------------------
# Per stream, at native rate: for every reading and every (window, quantile)
# of the sweep, the baseline and the enhancement, with their uncertainties
# (METHODS.md §6). Windows are durations centred on each reading; a reading
# counts in proportion to the share of its cell inside the window (§6.3).
baseline:
  # Strictly increasing, short -> long. Also defines the multi-scale
  # hierarchy for nested-plume attribution (short window catches the sharp
  # blip riding on the broad plume caught by the long window).
  windows: [2min, 10min, 60min]
  quantiles: [0.01, 0.05, 0.10]
  # Validity is a COUNT of readings in the window, tied to the quantile
  # (§6.4): null means ceil(1/q) for each quantile -- 100, 20 and 10 here --
  # the count at which a window holds, on average, one reading below its
  # q-quantile; with fewer it usually holds none that low. An integer applies
  # to every quantile. A thinner window is blank, with its count recorded.
  min_readings: null
  # How each variable's baseline is built (§6.5), keyed instrument.variable;
  # anything not named uses rolling_quantile. The names below are those of
  # examples/configs/manifest_multiformat_example.yaml, and are checked
  # against the manifest when the two configs are combined (load_config).
  methods:
    # The Picarro's methane baseline, joined onto the Aeris's cells: both
    # declare field ch4, and one atmosphere has one methane background.
    aeris.ch4_aeris: {method: from_field, instrument: picarro}
    # A canister fills every nine minutes and cannot see a background at
    # minutes; at zero the enhancement is the concentration (§6.1).
    voc_pfp.toluene: {method: constant, value: 0.0}
    # Spelled out for the default, which needs no entry at all.
    voc_pfp.benzene: {method: rolling_quantile}

# --- Events ----------------------------------------------------------------
# Per variable and sweep point, plume-free air is described by its clean level
# (the most common enhancement) and clean spread (1.4826 x the median distance
# below it); thresholds are multiples of that spread above that level
# (METHODS.md §6.8). The clean spread is NOT a measurement uncertainty: it
# includes the background's wobble at the window's scale.
events:
  # Both swept; every entry must exceed every exit. On 1 s white noise, entry
  # 2 finds about 79 chance events an hour, 3 about 5 and 4 about 0.1.
  enter_multiple: [3.0, 4.0, 5.0]
  exit_multiple: [1.0, 1.5, 2.0]
  max_internal_gap: 5s    # bridge dips below exit shorter than this
  # A dropout (a hole in the readings) shorter than this is bridged as a dip
  # is, so one missing row does not split a plume; nothing is filled in.
  max_bridged_dropout: 5s
  # Level and spread are computed per record: split at gaps longer than
  # record_gap, and cut into equal parts no longer than max_record_length.
  record_gap: 2h
  max_record_length: 6h
  # On a mobile platform whose gas file carries its speed, as the NOAA ARC
  # suite's does, records also split where the platform stays parked for at
  # least record_gap, so a long stop at base and the drive after it are
  # described apart, while shorter stops stay with the drive. Shown commented:
  # the multiformat example is stationary.
  # platform_state:
  #   arc: {variable: speed, moving_above: 5.0}
  # Fewer readings than this below its level, and a record is blank with the
  # reason and defines no events of its own.
  min_clean_readings: 100
  clean_level_estimator: half_sample_mode
  # A canister holds a few dozen fills a drive (32 on the 2024-07-18 drive,
  # 261 over ten drive days), far below min_clean_readings, so its variables
  # take their events from a dense analyzer instead. Keyed by
  # instrument (every gas it declares) or instrument.variable (which wins);
  # the trigger may measure any field. Names as in
  # manifest_multiformat_example.yaml, checked when the two are combined.
  triggers:
    voc_pfp: picarro.ch4
    voc_pfp.benzene: aeris.ch4_aeris

# --- Optional: low-pass smoothing to align disjoint plumes -------------------
smoothing:
  enabled: true
  cutoff_periods: [30s, 60s, 120s]   # sweep: resolution vs covariance trade-off
  order: 4

# --- Optional: Source Complex clustering -------------------------------------
clustering:
  enabled: true
  eps_m: 500.0            # DBSCAN neighborhood radius (scaled meters)
  space_time_scale: 2.0   # m per s: advection-speed equivalence for time
  min_samples: 2

# --- Enhancement-ratio regressions -------------------------------------------
regression:
  reference_species: ch4  # denominator; must be a role=gas manifest variable
  # 'york' (errors-in-both-axes, correlation-aware) is the default preferred
  # estimator; 'odr' is an opt-in numerical cross-check, shown here alongside
  # 'ols' to demonstrate that all three registered methods can run together.
  methods: [ols, york, odr]
  min_points: 8
  confidence_level: 0.95
