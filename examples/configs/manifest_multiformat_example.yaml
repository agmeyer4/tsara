# ============================================================================
# TSARA manifest example: a MULTI-FORMAT campaign
# ----------------------------------------------------------------------------
# The stationary and mobile examples show the common shapes. This one exists
# to show the awkward ones, because real archives are mostly awkward: an
# instrument whose files sit under several directory layouts, a logger that
# splits the timestamp across two columns, a headerless file hundreds of
# columns wide, a processed stage stored as parquet, and an ICARTT tree with
# several revisions of the same day.
#
#     from tsara import load_manifest
#     from tsara.ingest import ingest_campaign
#     streams = ingest_campaign(load_manifest("manifest_multiformat_example.yaml"))
# ============================================================================

name: multiformat_demo
description: >
  Demonstration manifest covering every loader TSARA ships and the path- and
  column-level awkwardness real campaign archives contain.

base_path: ../data

platform:
  kind: stationary
  latitude: 40.7660
  longitude: -111.8475
  altitude_m: 1300.0

instruments:

  # --- Whitespace-delimited logger, timestamp split across two columns ------
  picarro:
    description: Cavity ring-down analyzer writing space-padded .dat files.
    loader:
      format: csv
      # Several layouts at once: the campaign was reorganized mid-season, and
      # both trees are still on disk. The crawler searches all of them and
      # de-duplicates, so adding a layout is a YAML edit.
      path_templates:
        - "picarro/%Y/%m/%d/*.dat"
        - "archive/picarro_backup/*.dat"
      # '\s+' matches runs of spaces, which is how these files are aligned.
      delimiter: '\s+'
      time:
        # Two columns, rejoined with `join` before parsing. The singular
        # `column:` spelling is still valid for the ordinary one-column case.
        columns: [DATE, TIME]
        join: " "
        format: "%Y-%m-%d %H:%M:%S.%f"
        timezone: UTC
      # What interval of air each row describes. This analyzer samples
      # continuously and publishes 1-minute averages, so a row is not an
      # instant: it is a 60 s cell, and the timestamp names its START. Say so
      # and TSARA pairs it against faster instruments over exactly the right
      # minute; leave it out and every cell is silently misplaced by 30 s.
      # `method: mean` is a claim that an explicit averaging step produced the
      # number -- see the aeris entry below for the other case.
      support:
        label: start
        width: 60s
        method: mean
    variables:
      ch4:
        column: CH4_dry
        role: gas
        units: ppm
        convert: {from_unit: ppm, to_unit: ppb, scale: 1000.0}
        uncertainty:
          # `at_width` says these figures are the manufacturer's 1-second
          # precision, while the data above are 1-minute means. Ingestion
          # stores them exactly as written and records the mismatch (here,
          # cells 60x the quoted interval); it does not reconcile the two,
          # because that needs `decorrelation_timescale` -- how much averaging
          # helps depends entirely on how quickly the error decorrelates, and
          # at tau = 5 min the 60 samples in a cell are worth barely more than
          # one, so the naive square-root-of-N answer would be far too
          # optimistic. The stage that wants a sigma at a particular support
          # does that in one step, from these three declarations
          # (METHODS.md 3.4, 10.8).
          random: {mode: declared, absolute: 0.7, relative: 0.0005, at_width: 1s}
          systematic: {mode: declared, relative: 0.002}
          decorrelation_timescale: 5min
        qaqc:
          # Bounds are written in CANONICAL units: QA/QC runs after the
          # ppm -> ppb conversion above (METHODS.md 9.4).
          - {kind: range, min: 1500.0, max: 100000.0}
          - {kind: flag, flag_column: ALARM_STATUS, good_values: [0]}
      cavity_pressure:
        column: CavityPressure
        role: aux
        units: torr

  # --- Headerless instrument, far wider than the part anyone wants ----------
  particle_counter:
    description: >
      Optical particle counter writing data on line 1 with no header at all;
      the column meanings live in the manual, which is what a manifest is for.
    loader:
      format: csv
      path_template: "opc/*.csv"
      # `header_row: null` says there is no header line. `column_names` then
      # names a PREFIX -- surplus columns become column_3, column_4, ... so a
      # 30-bin instrument does not need 30 YAML entries to read the first few.
      header_row: null
      column_names: [timestamp, total_count, bin_0p3um]
      time: {column: timestamp, format: iso8601}
    variables:
      pm_total:
        column: total_count
        role: aux
        units: counts

  # --- Processed stage stored as parquet ------------------------------------
  aeris:
    description: Methane/ethane analyzer, instrument-aligned stage stored as parquet.
    # A property of the INSTRUMENT, not of its files: how its clock relates to
    # true air-at-inlet time. Added to every timestamp and to both cell
    # boundaries, so cells move without changing width. Here the logger ran
    # 4 s fast. Leave it out (the default) when the archive is already
    # lag-corrected upstream, which is the usual case -- the value applied is
    # recorded in the stream attributes so a double correction is visible.
    time_shift: -4s
    loader:
      format: parquet
      # One instrument nesting a level deeper than its siblings is common.
      path_template: "aligned/aeris/*/*.parquet"
      # Templates are include-only, so an archive that quarantines rejected
      # files in place -- 'aeris/Eng/bad/*.parquet' beside 'aeris/Eng/*.parquet'
      # -- needs a way to say "not that". Note the single '*' above already
      # excludes them by not descending; `exclude` is what you need the moment
      # a template uses '**', which is the usual answer to varying depth.
      exclude:
        - "**/bad/**"
        - "**/bad_timestamp/**"
      # The honest description of a laser analyzer that publishes a reading
      # per second. It is not a point sampler -- gas in the cell is a mixture
      # of the last few seconds -- but neither did anything average it over a
      # known interval, so `mean` would license arithmetic the data does not
      # support. `point` claims less and is therefore safe; the bounds are a
      # tiling convention rather than an instrument claim. `width: cadence`
      # takes the width from the file's own median sampling interval, and an
      # unknown label centres the cell, which leaves the timestamps where the
      # file put them.
      support:
        label: unknown
        width: cadence
        method: point
      # No `time:` block: parquet stores the dataframe index, so there is
      # usually no timestamp to parse. Declare one only for files that keep
      # time in an ordinary column instead.
    variables:
      c2h6:
        column: C2H6_ppb
        role: gas
        units: ppb
        uncertainty:
          # The instrument publishes its own per-point 1-sigma. That column is
          # scaled by `convert.scale` if present, but never by `convert.offset`
          # -- a spread has no origin (METHODS.md 2.2).
          random: {mode: reported, column: C2H6_1SIGMA}
          systematic: {mode: declared, relative: 0.03}
      # The gas the picarro measures too. Names only need to be unique WITHIN
      # an instrument, so this could simply be called `ch4` as well; a joined
      # product would then suffix the two columns with their instruments
      # (`ch4_picarro`, `ch4_aeris`) -- but only when both are selected, so a
      # column's spelling would depend on what it was joined with. A name of
      # its own keeps the spelling fixed, and `field` records that it is still
      # methane: the quantity a later stage asks for when it wants every methane
      # record in the campaign. `field` defaults to the variable's name, which
      # is why the picarro's `ch4` does not need one (METHODS.md 1.6).
      ch4_aeris:
        column: CH4_ppb
        field: ch4
        role: gas
        units: ppb

  # --- ICARTT tree with several revisions per day ---------------------------
  voc_pfp:
    description: Whole-air VOC canister suite distributed as ICARTT.
    loader:
      format: icartt
      # {field} placeholders are harvested from the matched paths as campaign
      # metadata; `institution` is pinned below, which also narrows the scan.
      path_template: "{institution}/{platform_id}/%Y/*.ict"
      # Archives hold R0 preliminary alongside R1 final. 'latest' keeps the
      # newest of each distinct product -- distinct meaning same instrument,
      # same day AND same trailing comment field, since files differing only
      # after the revision (processing levels, separate drives) are different
      # data rather than revisions of one another (METHODS.md 9.3).
      revision_policy: latest
      # How much row loss is a misparse rather than a bad day. A row is
      # dropped when its timestamp will not parse or its field count is
      # wrong; past this fraction the read raises instead of warning. The
      # default of 0.5 is deliberately loose -- one real file here loses 14
      # rows of 84,362 to a logger interrupted mid-number, which is not worth
      # refusing a day of data over, while the pathology it exists to catch
      # loses 99.98% and looks downstream like a quiet instrument rather than
      # a broken parse. Raise it toward 1.0 for archives where heavy loss is
      # genuinely expected; 1.0 restores warn-only behaviour.
      max_dropped_fraction: 0.5
      # Text -> float conversion. 'fast' (the default) is pandas' usual
      # parser; 'exact' guarantees the stored double is the nearest one to
      # the digits in the file. They differ on ~0.4% of values in a real
      # ICARTT archive, by ~1e-16 relative, and 'exact' costs ~20-34% more
      # ingestion time -- so turn it on when bitwise reproducibility matters
      # more than throughput (METHODS.md 9.2.2).
      float_precision: exact
      # Canisters are the case a uniform width cannot express: each one fills
      # for however long it fills, commonly 14-16 s, and the file states the
      # boundaries per row. Naming the columns is the strongest rung of the
      # ladder -- the cell is read, not inferred. `start_column` is needed
      # only because this file's own time axis is the MIDPOINT; when the time
      # axis is already the start, `stop_column` alone is enough. Note there
      # is no `label` or `width` here: per-row boundaries and a uniform
      # declaration are alternatives, and giving both is refused.
      support:
        start_column: Time_Start
        stop_column: Time_Stop
        method: mean
    metadata:
      institution: noaa
    variables:
      # Name the MEASURED column. Some merged archives also publish an
      # interpolated copy filled into every row -- the 2024 NOAA mobile-lab
      # files pair CH4_ppb with CH4_i_ppb -- and TSARA cannot tell the two
      # apart, so a gas read from the copy arrives already interpolated, with
      # full coverage it never had (METHODS.md 9.2.3).
      benzene:
        column: Benzene_ppbv
        role: gas
        units: ppbv
      toluene:
        column: Toluene_ppbv
        role: gas
        units: ppbv

  # --- Met, including a circular variable -----------------------------------
  met:
    description: Sonic anemometer.
    loader:
      format: csv
      path_template: "met/*.csv"
      na_values: ["NAN", "-9999"]
      time: {column: TIMESTAMP, format: iso8601}
    variables:
      wind_dir:
        column: WD_deg
        role: met
        units: degrees
        # Circular variables are averaged with circular statistics rather than
        # arithmetically, so that 359 deg and 1 deg average to 0, not 180.
        circular: true
      wind_speed:
        column: WS_ms
        role: met
        units: m s-1
      # A conversion with an OFFSET, which the ppm -> ppb cases above do not
      # show. Applied as `canonical = raw * scale + offset`, in that order:
      # the scale first, then the shift. The order is not academic -- with a
      # non-zero offset, scaling-then-shifting and shifting-then-scaling give
      # different answers, which is why a conversion carrying both is the
      # only kind that can prove the order is right (METHODS.md 9.9).
      air_temperature:
        column: AirT_C
        role: met
        units: degC
        convert: {from_unit: degC, to_unit: K, offset: 273.15}
        qaqc:
          # In canonical units, so kelvin -- QA/QC runs after conversion.
          - {kind: range, min: 220.0, max: 330.0}
