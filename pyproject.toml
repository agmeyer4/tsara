# ============================================================================
# TSARA — Time Series and Ratio Analyses
# ----------------------------------------------------------------------------
# Packaging is PEP 621 (all metadata lives here) with a setuptools backend and
# a "src layout" (code under src/tsara). The src layout is deliberate: it
# forces tests to run against the *installed* package rather than the working
# directory, which catches packaging mistakes (missing modules, bad imports)
# that a flat layout silently hides.
# ============================================================================

[build-system]
# >=77 for PEP 639 license expressions (the `license = "MIT"` string below).
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "tsara"
version = "0.1.0"
description = "Time Series and Ratio Analyses: enhancement-ratio extraction and source fingerprinting for multi-rate trace gas timeseries."
readme = "README.md"
# PEP 639 SPDX license expression; the old `license = { file = ... }` table
# form is deprecated and newer setuptools will eventually reject it.
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Aaron Meyer", email = "agmeyer4@gmail.com" }]
keywords = [
    "atmospheric-science",
    "trace-gases",
    "enhancement-ratios",
    "timeseries",
    "plume-detection",
    "source-apportionment",
]
# NOTE: no "License ::" classifier — PEP 639 forbids mixing the deprecated
# license classifiers with the SPDX `license` expression above.
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Atmospheric Science",
]

# All runtime dependencies for the full roadmap are declared up front so the
# development environment only needs to be built once. Phase 1 itself only
# imports pydantic, PyYAML, and pandas (for time-frequency validation).
dependencies = [
    "pydantic>=2.5",
    "PyYAML>=6.0",
    "numpy>=1.24",
    "pandas>=2.0",
    "xarray>=2023.6",
    "dask[array]>=2023.6",
    "scipy>=1.10",
    "statsmodels>=0.14",
    "scikit-learn>=1.3",
    "typer>=0.9",
    # Persistence of TSARA bundle stage products (CLAUDE.md §5): netCDF4 is
    # the default interchange format for gridded/stream products (the
    # atmospheric-community standard), pyarrow backs the Parquet event
    # catalog. Both are needed from Phase 2 onward, since every phase ships
    # save/load for the stage products it introduces.
    "netCDF4>=1.6",
    "pyarrow>=14",
    # NOTE: deliberately NO `icartt` dependency — the PyPI package is
    # GPL-3.0 (incompatible with our MIT license as a hard dependency) and
    # dormant since 2022. TSARA ships its own ICARTT FFI-1001 reader
    # (Phase 3), which also lets us tolerate the spec-noncompliant files
    # common in real campaigns.
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.4",
    "mypy>=1.8",
    "types-PyYAML>=6.0",
    "pandas-stubs>=2.0",
]

[project.urls]
Repository = "https://github.com/agmeyer4/tsara"

# The CLI entry point (`tsara run config.yaml`) is added in Phase 9 when
# src/tsara/cli.py exists:
# [project.scripts]
# tsara = "tsara.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

# PEP 561: ship the `py.typed` marker so that type checkers run by *users* of
# TSARA actually read our annotations. Without it, `import tsara` is treated as
# untyped no matter how strictly the source is annotated — the annotations are
# there, but invisible to anyone outside this repo.
[tool.setuptools.package-data]
tsara = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# -ra: summarize skipped/failed reasons; keeps CI/HPC logs readable.
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# E/F: pycodestyle+pyflakes basics; I: import sorting; D: docstring presence
# (NumPy convention enforced below); UP: modernize to 3.11 idioms.
select = ["E", "F", "I", "UP", "D"]
# D105/D107: magic-method/__init__ docstrings are noise on Pydantic models.
ignore = ["D105", "D107"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.per-file-ignores]
# Tests document themselves through their names and assertions.
"tests/*" = ["D"]

[tool.mypy]
python_version = "3.11"
strict = true
# Pydantic's metaprogramming (Field(...) defaults, model_validator, etc.)
# needs this plugin to type-check correctly; without it mypy misreads which
# constructor arguments are actually required.
plugins = ["pydantic.mypy"]
# Tests are checked too. They are the largest body of code in the repo and the
# place type errors hide most easily, because a test that type-checks wrongly
# still passes. Checking them is also what keeps the annotation standard from
# splitting into eras: `src` strictly typed, `tests` gradually not.
files = ["src/tsara", "tests"]
# Needed because tests/ is not a package: without these, tests/conftest.py and
# tests/synthetic/conftest.py both claim the module name "conftest" and mypy
# refuses to check either. Deriving module names from the repo root instead
# makes them tests.conftest and tests.synthetic.conftest.
explicit_package_bases = true
namespace_packages = true
mypy_path = "src"

[tool.coverage.run]
source = ["tsara"]
branch = true

[tool.coverage.report]
show_missing = true
# Genuinely at 100% line+branch as of the end of the Phase 1 walkthrough
# (2026-07-20) -- this gate exists to catch the day that regresses, not as
# an aspirational target.
fail_under = 100
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
# False (the plugin default): _BaseLoader.path_templates deliberately uses a
# dynamic AliasChoices("path_templates", "path_template") alias (the
# singular/plural manifest ergonomics feature) -- that is intentional API
# design, not a mistake the plugin should flag.
warn_required_dynamic_aliases = false

[[tool.mypy.overrides]]
# SciPy ships no type stubs in this environment (scipy-stubs is a separate,
# partial package). The two functions TSARA imports from it — special.erfcx
# and signal.lfilter — are used behind our own fully-typed wrappers, so the
# untyped boundary is one line deep and does not leak into the public API.
module = ["scipy.*"]
ignore_missing_imports = true
